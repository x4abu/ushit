plugins {
    id 'com.android.application'
}

android {
    namespace 'com.x4abu.ushit'
    compileSdk 34

    defaultConfig {
        applicationId "com.x4abu.ushit"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Sign release build with debug keystore automatically for easy direct install on phone
            signingConfig signingConfigs.debug
        }
        debug {
            applicationIdSuffix ""
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
