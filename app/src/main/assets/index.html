<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>ushit — Minimalist Block Notes</title>
  <link rel="stylesheet" href="css/app.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23d95e34'><rect width='24' height='24' rx='6'/><text x='12' y='16' fill='white' font-size='12' font-weight='bold' text-anchor='middle'>u</text></svg>">
</head>
<body>
  <div id="app">
    <!-- Collapsible Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <a href="#" class="brand">
          <div class="brand-logo">u</div>
          <span class="brand-title">ushit</span>
        </a>
        <div class="sidebar-tools">
          <button class="icon-btn" id="newPageBtn" title="Create New Page">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
          </button>
        </div>
      </div>

      <!-- Search in Sidebar -->
      <div class="sidebar-search-box">
        <div class="search-input-wrap">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
          <input type="text" class="search-input" id="searchInput" placeholder="Search pages..." />
        </div>
      </div>

      <!-- Pages List -->
      <div class="pages-container">
        <div class="pages-section-label">
          <span>Pages</span>
        </div>
        <div class="pages-list" id="pagesList"></div>
      </div>

      <!-- Sidebar Footer -->
      <div class="sidebar-footer">
        <button class="icon-btn" id="themeToggleBtn" title="Toggle Theme">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
        </button>
        <span>offline-first</span>
        <button class="icon-btn" id="exportModalBtn" title="Export & Backup">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
        </button>
      </div>
    </aside>

    <!-- Sidebar Backdrop on Mobile -->
    <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

    <!-- Main Workspace -->
    <main class="main-workspace">
      <!-- Top Navigation -->
      <header class="workspace-nav">
        <div class="nav-left">
          <button class="icon-btn" id="sidebarToggleBtn" title="Toggle Sidebar">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
          </button>
          <span class="breadcrumb-page-title" id="pageBreadcrumb">Untitled</span>
        </div>
        <div class="nav-right">
          <span class="status-badge saved" id="saveStatus">Saved</span>
        </div>
      </header>

      <!-- Scrollable Note Canvas -->
      <div class="doc-scroll-area">
        <div class="doc-wrapper">
          <input type="text" class="doc-title-input" id="docTitleInput" placeholder="Untitled Page" spellcheck="false" autocomplete="off" />
          <div class="blocks-list" id="blocksList"></div>
        </div>
      </div>

      <!-- Mobile Ergonomic Quick Bar -->
      <div class="mobile-toolbar" id="mobileToolbar">
        <button class="toolbar-btn" data-type="text">Text</button>
        <button class="toolbar-btn" data-type="h1">H1</button>
        <button class="toolbar-btn" data-type="h2">H2</button>
        <button class="toolbar-btn" data-type="todo">To-do</button>
        <button class="toolbar-btn" data-type="bullet">Bullet</button>
        <button class="toolbar-btn" data-type="quote">Quote</button>
        <button class="toolbar-btn" data-type="callout">Callout</button>
        <button class="toolbar-btn" data-type="code">Code</button>
        <button class="toolbar-btn" data-type="divider">Divider</button>
      </div>
    </main>

    <!-- Slash Command Menu Dropdown -->
    <div class="slash-menu" id="slashMenu">
      <div class="slash-menu-header">Basic Blocks</div>
      <div class="slash-menu-items" id="slashMenuItems"></div>
    </div>

    <!-- Export & Backup Modal -->
    <div class="modal-overlay" id="modalOverlay">
      <div class="modal-content">
        <div class="modal-header">
          <h3 class="modal-title">Export & Backup</h3>
          <button class="icon-btn" id="modalCloseBtn" title="Close">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
          </button>
        </div>
        <div class="modal-body">
          <p>Export the active document or backup your entire local-first workspace.</p>
          <div class="modal-action-row">
            <button class="btn btn-secondary" id="exportMarkdownBtn">Export Current as .MD</button>
            <button class="btn btn-secondary" id="exportJsonBtn">Download Backup (.JSON)</button>
          </div>
          <hr style="border:0;border-top:1px solid var(--border);" />
          <div>
            <label style="display:block;font-size:12px;font-weight:600;margin-bottom:6px;color:var(--fg-muted);">Restore from Backup:</label>
            <input type="file" id="importJsonInput" accept=".json" style="font-size:12px;color:var(--fg-secondary);" />
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="js/icons.js"></script>
  <script src="js/engine.js"></script>
</body>
</html>
